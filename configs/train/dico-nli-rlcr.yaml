# Starter recipe, not a tuned or GPU-validated experiment. Supply your own model.
model_name_or_path: /models/base-instruct
dataset_name: data/dico-nli/prompted/en
dataset_train_split: train
dataset_test_split: dev
output_dir: outputs/train/dico-nli-rlcr
trust_remote_code: false
torch_dtype: bfloat16
bf16: true
attn_implementation: sdpa
use_peft: true
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: [q_proj, v_proj]
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
reward_funcs: [dico_accuracy, dico_brier]
reward_weights: [1.0, 0.5]
scale_rewards: false
beta: 0.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_generations: 4
max_prompt_length: 512
max_completion_length: 64
mask_truncated_completions: false
temperature: 0.9
learning_rate: 0.00001
max_steps: 10
seed: 42
eval_strategy: "no"
save_strategy: steps
save_steps: 5
logging_steps: 1
report_to: []
log_completions: false
push_to_hub: false
