# Use the same prepared prompts for B0, accuracy-only, and RLCR comparisons.
dataset:
  name: data/dico-nli/prompted/en
  split: dev
  id_column: instance_id
models:
  - name: candidate
    model: /models/base-or-adapter
    tokenize_key: prompt
    torch_dtype: bfloat16
    load_in_4bit: true
    n: 1
    temperature: 0
    max_tokens: 64
    hf_batch_size: 1
    seed: 42
output_dir: outputs/eval/dico-nli
fresh: false
